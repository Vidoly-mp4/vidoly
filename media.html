<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1 id="pageName">Watch Video</h1>
</header>

<main class="media-page">

    <div class="ad-banner">
        Top Advertisement
    </div>

    <div class="player-section">

        <div class="side-ad">
            Left Advertisement
        </div>

        <div class="video-container">

            <iframe
                id="videoPlayer"
                src=""
                allowfullscreen>
            </iframe>

        </div>

        <div class="side-ad">
            Right Advertisement
        </div>

    </div>

    <a
        id="watchMore"
        class="watch-button"
        href="#"
        target="_blank">

        Watch More

    </a>

    <div class="ad-banner">
        Bottom Advertisement
    </div>

</main>

<script src="js/main.js"></script>

</body>
</html>
