<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Admin Panel</h1>
</header>

<main class="admin">

    <section class="stats">

        <div class="stat-card">
            <h2 id="videoCount">0</h2>
            <p>Videos</p>
        </div>

        <div class="stat-card">
            <h2 id="imageCount">0</h2>
            <p>Images</p>
        </div>

        <div class="stat-card">
            <h2 id="totalCount">0</h2>
            <p>Total Posts</p>
        </div>

    </section>

    <section class="actions">

        <button id="addVideoBtn">
            Add Video
        </button>

        <button id="addImageBtn">
            Add Image
        </button>

    </section>

    <section>

        <h2>Content</h2>

        <div id="contentList">

        </div>

    </section>

</main>

<script src="js/admin.js"></script>

</body>
</html>
